imports:
    - { resource: "../../../config/services.yaml" }

doctrine:
    orm:
        enable_lazy_ghost_objects: true
        enable_native_lazy_objects: true

google_tag_manager:
    enabled: true
    id: "GTM-TESTTEST"
    autoAppend: false

gtm:
    inject: true
    features:
        environment: true
        route: true
        context: true
        events: true

sylius_gtm_enhanced_ecommerce:
    features:
        purchase: true
